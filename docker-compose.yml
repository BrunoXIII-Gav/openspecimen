services:
  db:
    image: mysql:8.0
    container_name: os-db
    restart: unless-stopped
    command:
      - --lower_case_table_names=1
      - --log_bin_trust_function_creators=1
      - --binlog_format=ROW
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openspecimen}
      MYSQL_USER: ${MYSQL_USER:-os_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-os_password}
    ports:
      - "${OS_DB_PORT:-3308}:3306"
    volumes:
      - os_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: os-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-openspecimen}
      DB_USER: ${MYSQL_USER:-os_user}
      DB_PASS: ${MYSQL_PASSWORD:-os_password}
      DATASOURCE_TYPE: ${DATASOURCE_TYPE:-fresh}
      DATASOURCE_JNDI: ${DATASOURCE_JNDI:-jdbc/openspecimen}
      SAML_PORTAL_LOGOUT_URL: ${SAML_PORTAL_LOGOUT_URL:-https://portal.jellbru.lat/}
    ports:
      - "${OS_HTTP_PORT:-8085}:8080"
    volumes:
      - os_app_data:/opt/openspecimen
      - ./security:/opt/openspecimen/security:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/openspecimen/ui-app/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  os_mysql_data:
  os_app_data:
